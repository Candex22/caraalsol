<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Armador de Cara al Sol</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alegreya+Sans:wght@300;400;700&family=Fredoka:wght@600;700&family=Inter:wght@400;700&family=Source+Code+Pro:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f1ea;--pn:#fff;--tx:#1d1d1b;--bd:#d6d0c2;--ac:#c9561a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1a17;--pn:#26241f;--tx:#eee9dd;--bd:#443f35;--ac:#ef8a52}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px Inter,Arial,sans-serif}
#app{display:grid;grid-template-columns:400px 1fr;gap:16px;padding:14px;min-height:100vh}
@media(max-width:900px){#app{grid-template-columns:1fr}#side{position:static;max-height:none}}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:14px}
h1{font:400 22px 'Abril Fatface',serif;margin:0 0 10px}
#side{position:sticky;top:14px;align-self:start;max-height:calc(100vh - 28px);overflow:auto}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
button,select,input,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.on{border-color:var(--ac);font-weight:700}
label{display:block;font-size:12px;margin:9px 0 3px;opacity:.8}input,select,textarea{width:100%}
.row{display:flex;gap:8px}.row>*{flex:1}.tab{display:none}.tab.on{display:block}
.it{display:flex;align-items:center;gap:4px;border:1px solid var(--bd);border-radius:6px;padding:5px 7px;margin-top:6px;font-size:13px}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it button{padding:2px 7px}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}#st{font-size:12px;opacity:.8}
#pv{display:flex;flex-direction:column;gap:14px;align-items:center;overflow:auto}
.sh{box-shadow:0 2px 10px #0004;flex:none}
#stage,#mm{position:absolute;left:-12000px;top:0}
/* ===== Páginas de la revista ===== */
.pg{width:794px;height:960px;background:#fff;color:#000;position:relative;overflow:hidden;font:12.5px/1.27 Inter,Helvetica,Arial,sans-serif;letter-spacing:-.1px}
.hd{position:absolute;top:44px;left:67px;right:67px;display:flex;justify-content:space-between;font:300 10.5px 'Source Code Pro',monospace;letter-spacing:0;border-bottom:1px solid #000;padding-bottom:6px}
.od .hd{justify-content:flex-end}.pn{position:absolute;bottom:44px;font-size:13px}.ev .pn{left:67px}.od .pn{right:67px}
.pb{position:absolute;left:67px;right:67px;top:86px;bottom:100px;display:flex;flex-direction:column}
.tt{flex:none;text-align:center;margin-bottom:14px}.tt h2{font:700 25px 'Alegreya Sans',sans-serif;margin:6px 0 2px;letter-spacing:0}
.tt h2.fun{font:700 27px Fredoka,sans-serif}.tt h3{font:300 19px 'Alegreya Sans',sans-serif;margin:0 0 10px;letter-spacing:0}
.ph{display:block;object-fit:cover;max-width:100%;break-inside:avoid}
.tx{flex:1;min-height:0;overflow:hidden;column-fill:auto;column-gap:26px}.c2{columns:2}.c1{columns:auto}.tx p{margin:0 0 .55em;text-align:justify}
.sg{flex:none;text-align:right;font:700 13px/1.25 Inter,sans-serif;margin-top:16px}
.pill{border:1px solid #000;border-radius:16px;text-align:center;font:700 13px 'Alegreya Sans',sans-serif;padding:2px 0;letter-spacing:0;text-transform:uppercase}
.pill.k{background:#000;color:#fff}
.mo{font:300 10.5px/1.25 'Source Code Pro',monospace;letter-spacing:0;margin-bottom:20px}
.ct{margin:104px 67px 0;font:400 80px/1 'Abril Fatface',serif;letter-spacing:-3px;border-bottom:1px solid #000;white-space:nowrap}.ct sup{font-size:34px;vertical-align:top;position:relative;top:-6px;letter-spacing:0}
.cb{display:flex;margin:36px 67px 0;height:640px}.cl{width:45%}.cl .pill{margin:30px 0 8px}.cl .c{text-align:center}
.rope{width:10px;margin:0 20px;border:1px solid #999;background:repeating-linear-gradient(45deg,#aaa 0 1px,#fff 1px 3px)}
.cr{flex:1;font-size:calc(14px*var(--k,1))}.cr .pill{margin-bottom:14px}
.ig{border-top:1px solid #333;padding:calc(7px*var(--k,1)) 0}.ig:first-of-type{border:0}
.ixs{display:flex;justify-content:space-between;font:700 1em 'Alegreya Sans',sans-serif;text-transform:uppercase;letter-spacing:0}
.ixs span{font:400 .95em Inter,sans-serif}.ixi{font-size:.92em;margin:calc(6px*var(--k,1)) 0 0 10px;font-family:'Alegreya Sans',sans-serif;letter-spacing:0}.ixi span{font:400 .9em Inter,sans-serif}
.cols2{columns:2;margin-left:20px}.logo{float:right;width:120px;margin:0 0 6px 10px}
.nw{display:grid;grid-template-columns:1fr 1fr;gap:34px;flex:1}.nw .L{display:flex;flex-direction:column;justify-content:space-between}
.nw ul{margin:8px 0 18px;padding-left:20px;font-size:13px}.nw li{margin:1px 0}.nw .pill{margin:0 0 4px;font-size:12px}
.nlogo{font:400 70px/.9 'Abril Fatface',serif;letter-spacing:-3px;text-align:center;margin-top:50px}.nlogo small{display:block;font:700 32px 'Alegreya Sans',sans-serif;letter-spacing:12px;margin-top:8px}
.cum{font-size:13px;text-align:justify;margin:8px 0 0 4px}.nlogo{font-size:50px;line-height:.9;margin:6px 0 14px;break-inside:avoid}.nlogo small{font-size:24px;letter-spacing:8px}.tx p.bl{position:relative;padding-left:16px;margin:0 0 .45em;text-align:justify}.nimg{display:block;width:100%;margin:0 0 14px;break-inside:avoid}.nimgph{border:2px dashed #888;display:flex;align-items:center;justify-content:center;color:#666;font:12px monospace;height:220px;margin-bottom:14px;break-inside:avoid}.logo.lph{border:2px dashed #888;display:flex;align-items:center;justify-content:center;color:#666;font:11px monospace}.bl:not(.cn)::before{content:'•';position:absolute;left:3px}.pill.np{margin:8px 0 5px;font-size:12px;break-after:avoid;break-inside:avoid}.ph-row{display:flex;gap:8px;border:1px solid var(--bd);border-radius:6px;padding:6px;margin-top:8px}.ph-row>img{width:56px;height:56px;object-fit:cover;flex:none}.ph-row .g{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}.ph-row label{margin:2px 0;font-size:11px}.ph-row input,.ph-row select{padding:2px 4px;font-size:12px}.ph-row input[type=range]{padding:0}
</style></head><body>
<div id="app">
<div class="card" id="side">
<h1>Cara al Sol ☀</h1>
<div class="tabs"><button data-t="0" class="on">Portada</button><button data-t="1">Artículos</button><button data-t="2">Noticias</button></div>

<div class="tab on" id="t0">
<div class="row"><div><label>Mes</label><input data-k="mes"></div><div><label>Año</label><input data-k="anio"></div><div><label>Número</label><input data-k="numero"></div></div>
<label>Realización (uno por línea)</label><textarea data-k="real" rows="4"></textarea>
<label>Colaboradores (uno por línea)</label><textarea data-k="colabs" rows="5"></textarea>
<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="auto" style="width:auto"> Sumar los nombres de los artículos</label>
<label>Imagen de la portada (indice.jpg). Ya viene cargada; subí otra para reemplazarla</label><div class="row"><input type="file" id="logo" accept="image/*"><button id="nologo" style="flex:none">Restaurar</button></div>
</div>

<div class="tab" id="t1">
<div class="row"><div><label>Sección</label><select id="sec"></select></div><div><label>Formato</label><select id="fmt"></select></div></div>
<div class="row"><div><label>Columnas</label><select id="cols"><option value="2">2 columnas</option><option value="1">1 columna</option></select></div></div>
<label>Título (también va al índice)</label><input id="title">
<label>Subtítulo</label><input id="sub" placeholder="De Cara al Sol">
<label>Texto (línea en blanco = nuevo párrafo · **negrita** con doble asterisco)</label><textarea id="text" rows="9"></textarea>
<div class="row"><div><label>Firma</label><input id="sign" value="Siempre Listos para Servir,"></div><div><label>Nombre</label><input id="name" placeholder="Cara al Sol"></div></div>
<label>Fotos (opcional, podés subir varias)</label><input type="file" id="photo" accept="image/*" multiple><div id="phl"></div>
<div class="row" style="margin-top:12px"><button class="p" id="add">Agregar artículo</button><button id="cancel" style="display:none">Cancelar</button></div>
<div id="list"></div>
</div>

<div class="tab" id="t2">
<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="newson" style="width:auto"> Incluir página de Noticias</label>
<label>Imagen de noticias (noticias.jpg). Ya viene cargada; subí otra para reemplazarla</label><div class="row"><input type="file" id="nlogo" accept="image/*"><button id="nonlogo" style="flex:none">Restaurar</button></div><div id="units"></div><button id="addsec" style="margin-top:8px">Agregar sección</button>
<label>Cumpleaños (nombres separados por coma)</label><textarea id="cumple" rows="2"></textarea>
</div>
</div>

<div class="card">
<div class="top"><button class="p" id="pdf">Descargar PDF</button><button class="p" id="pdfc">Descargar compaginado</button><button id="sv">Guardar proyecto</button><button id="op">Abrir proyecto</button><input type="file" id="opf" accept=".json" style="display:none"><span id="st"></span></div>
<div id="pv"></div>
</div>
</div>
<div id="stage"></div><div id="mm"></div>

const KEY='cas_v1';
let S={meta:{mes:'',anio:'',numero:'',real:''},colabs:'',auto:true,logo:'',arts:[],news:{on:true,u:{},cumple:''}};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S=Object.assign(S,x)}catch(e){}
S.arts.forEach(a=>{if(a.photo&&!a.photos)a.photos=[{id:a.id+'p',src:a.photo,ar:1.5,w:100,pos:'top',para:1,al:'c',wrap:0,crop:0,res:1800}];if(!a.photos)a.photos=[]});
if(!S.news.secs)S.news.secs=UN.map((n,i)=>({id:'s'+i,name:n,text:(S.news.u&&S.news.u[n])||''}));
let editId=null,phs=[],tmr,run=0,dl=null;const IMGC={};
const st=m=>$('#st').textContent=m||'';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){st('No se pudo autoguardar (fotos muy pesadas). Descargá el proyecto.')}}
function sched(){save();clearTimeout(tmr);tmr=setTimeout(render,400)}
function readImg(f,png){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1800/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL(png?'image/png':'image/jpeg',.85))};im.src=fr.result};fr.readAsDataURL(f)})}
/* ---------- formulario ---------- */
$('#sec').innerHTML=SECS.map((s,i)=>`<option value="${i}">${s}</option>`).join('');
$('#fmt').innerHTML=Object.entries(FM).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.tab').forEach(e=>e.classList.remove('on'));b.classList.add('on');$('#t'+b.dataset.t).classList.add('on')});
function fill(){document.querySelectorAll('[data-k]').forEach(e=>{const k=e.dataset.k;e.value=k in S.meta?S.meta[k]:S[k]||''});$('#auto').checked=S.auto;$('#newson').checked=S.news.on;$('#cumple').value=S.news.cumple||'';nl()}
document.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>{const k=e.dataset.k;if(k in S.meta)S.meta[k]=e.value;else S[k]=e.value;sched()});
$('#auto').onchange=e=>{S.auto=e.target.checked;sched()};$('#newson').onchange=e=>{S.news.on=e.target.checked;sched()};
$('#cumple').oninput=e=>{S.news.cumple=e.target.value;sched()};
function nl(){$('#units').innerHTML=S.news.secs.map((x,i)=>`<div class="it" style="display:block"><div class="row"><input value="${esc(x.name)}" oninput="ns(${i},'name',this.value)"><button style="flex:none" onclick="nm(${i},-1)">↑</button><button style="flex:none" onclick="nm(${i},1)">↓</button><button style="flex:none" onclick="nd(${i})">✕</button></div><textarea rows="6" oninput="ns(${i},'text',this.value)" placeholder="Un punto por línea (pueden ser largos). **Negrita** con doble asterisco.">${esc(x.text)}</textarea></div>`).join('')}
function ns(i,k,v){S.news.secs[i][k]=v;sched()}
function nm(i,d){const j=i+d;if(j<0||j>=S.news.secs.length)return;[S.news.secs[i],S.news.secs[j]]=[S.news.secs[j],S.news.secs[i]];nl();sched()}
function nd(i){if(confirm('¿Eliminar esta sección?')){S.news.secs.splice(i,1);nl();sched()}}
$('#addsec').onclick=()=>{S.news.secs.push({id:'s'+Date.now(),name:'Nueva sección',text:''});nl();sched()};
async function setLg(k,f){const u=await readImg(f,k=='logo');S[k]=u;S[k+'Ar']=await new Promise(r=>{const i=new Image();i.onload=()=>r(i.width/i.height);i.src=u});sched()}
$('#logo').onchange=e=>{if(e.target.files[0])setLg('logo',e.target.files[0])};$('#nologo').onclick=()=>{S.logo='';$('#logo').value='';sched()};
$('#nlogo').onchange=e=>{if(e.target.files[0])setLg('nlogo',e.target.files[0])};$('#nonlogo').onclick=()=>{S.nlogo='';$('#nlogo').value='';sched()};
async function addPh(f){const u=await readImg(f);const ar=await new Promise(r=>{const i=new Image();i.onload=()=>r(i.width/i.height);i.src=u});phs.push({id:'f'+Date.now()+Math.random().toString(36).slice(2,5),src:u,ar,w:100,pos:'top',para:1,al:'c',wrap:0,crop:0,res:1100});phl()}
$('#photo').onchange=async e=>{for(const f of e.target.files)await addPh(f);e.target.value=''};
const O=(a,c)=>a.map(([v,t])=>`<option value="${v}"${v==c?' selected':''}>${t}</option>`).join('');
function pc(i,k,v){phs[i][k]=v}
function phl(){$('#phl').innerHTML=phs.map((p,i)=>`<div class="ph-row"><img src="${p.src}"><div class="g"><label>Ancho <b>${p.w}%</b><input type="range" min="15" max="100" value="${p.w}" oninput="pc(${i},'w',+this.value);this.previousElementSibling.textContent=this.value+'%'"></label><label>Resolución<select onchange="pc(${i},'res',+this.value)">${O([[700,'Baja (700 px)'],[1100,'Media (1100 px)'],[1800,'Alta (1800 px)']],p.res)}</select></label><label>Lugar<select onchange="pc(${i},'pos',this.value)">${O([['top','Arriba del texto'],['p','Después del párrafo…'],['end','Al final']],p.pos)}</select></label><label>Párrafo n.º<input type="number" min="1" value="${p.para}" onchange="pc(${i},'para',+this.value)"></label><label>Alineación<select onchange="pc(${i},'al',this.value)">${O([['l','Izquierda'],['c','Centro'],['r','Derecha']],p.al)}</select></label><label>Recorte<select onchange="pc(${i},'crop',+this.value)">${O([[0,'Original'],[1,'4:3'],[2,'16:9'],[3,'1:1']],p.crop)}</select></label><label style="grid-column:span 2"><input type="checkbox" style="width:auto" ${p.wrap?'checked':''} onchange="pc(${i},'wrap',+this.checked)"> Texto alrededor (solo con lugar «después del párrafo» y alineación izq./der.)</label></div><button onclick="phs.splice(${i},1);phl()">✕</button></div>`).join('')}
function reset(){editId=null;phs=[];phl();['title','sub','text','name','photo'].forEach(i=>$('#'+i).value='');$('#sign').value='Siempre Listos para Servir,';$('#add').textContent='Agregar artículo';$('#cancel').style.display='none'}
$('#cancel').onclick=reset;
$('#add').onclick=()=>{const a={id:editId||String(Date.now()),sec:+$('#sec').value,fmt:$('#fmt').value,cols:+$('#cols').value,title:$('#title').value.trim(),sub:$('#sub').value.trim(),text:$('#text').value,sign:$('#sign').value,name:$('#name').value.trim(),photos:phs.map(p=>({...p}))};
 if(!a.title&&a.sec<3)return alert('Falta el título (se usa en el índice).');
 const i=S.arts.findIndex(x=>x.id==a.id);if(i<0)S.arts.push(a);else S.arts[i]=a;reset();list();sched()};
function list(){$('#list').innerHTML=S.arts.map((a,i)=>`<div class="it"><span>${SECS[a.sec].slice(0,10)}… · ${esc(a.title||SECS[a.sec])}</span><button onclick="ed(${i})">✎</button><button onclick="mv(${i},-1)">↑</button><button onclick="mv(${i},1)">↓</button><button onclick="rm(${i})">✕</button></div>`).join('')}
function ed(i){const a=S.arts[i];editId=a.id;$('#sec').value=a.sec;$('#fmt').value=a.fmt;$('#cols').value=a.cols;$('#title').value=a.title;$('#sub').value=a.sub;$('#text').value=a.text;$('#sign').value=a.sign;$('#name').value=a.name;phs=(a.photos||[]).map(p=>({...p}));phl();$('#add').textContent='Actualizar artículo';$('#cancel').style.display='';document.querySelector('[data-t="1"]').click()}
function mv(i,d){const j=i+d;if(j<0||j>=S.arts.length)return;[S.arts[i],S.arts[j]]=[S.arts[j],S.arts[i]];list();sched()}
function rm(i){if(confirm('¿Eliminar este artículo?')){S.arts.splice(i,1);list();sched()}}
/* ---------- maquetación ---------- */
const FONTS=["12px Inter","700 12px Inter","300 12px 'Source Code Pro'","12px 'Source Code Pro'","700 12px 'Alegreya Sans'","300 12px 'Alegreya Sans'","12px 'Abril Fatface'","700 12px Fredoka"];
const fonts=()=>Promise.all(FONTS.map(f=>document.fonts.load(f).catch(()=>0)));
function pageEl(n,label,inner){const d=document.createElement('div');d.className='pg '+(n%2?'od':'ev');d.innerHTML=`<div class="hd">${n%2?'':'<span>Revista Cara al Sol</span>'}<span>${n%2?'Edición N°'+esc(S.meta.numero)+' | Mes: '+esc(S.meta.mes):esc(label)}</span></div><div class="pb">${inner}</div><div class="pn">${n}</div>`;return d}
const toks=(t,a)=>{const o=[],ph=(a&&a.photos)||[],P=ph.filter(p=>p.pos=='p'),pr=t.split(/\n+/).filter(x=>x.trim());pr.forEach((p,i)=>{if(i)o.push('\n');p.split(/\s+/).filter(Boolean).forEach(w=>o.push(w));P.filter(x=>Math.min(Math.max(+x.para||1,1),pr.length)==i+1).forEach(x=>o.push('\u0001'+x.id))});ph.filter(p=>p.pos=='end').forEach(x=>o.push('\u0001'+x.id));return o};
const rich=w=>w.map(esc).join(' ').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*\*/g,'');
function imgH(a,id,top){const p=(a.photos||[]).find(x=>x.id==id);if(!p)return'';const ar=[p.ar,4/3,16/9,1][p.crop||0],f=p.wrap&&p.al!='c'&&!top;return `<img class="ph" src="${IMGC[p.id+'|'+p.res]||p.src}" style="width:${p.w}%;aspect-ratio:${ar};${f?`float:${p.al=='l'?'left':'right'};margin:3px ${p.al=='l'?'10px 6px 0':'0 6px 10px'}`:`margin:6px ${p.al=='r'?'0':'auto'} 6px ${p.al=='l'?'0':'auto'}`}">`}
async function prep(){for(const a of S.arts)for(const p of a.photos||[]){const k=p.id+'|'+p.res;if(IMGC[k])continue;await new Promise(r=>{const i=new Image();i.onload=()=>{const w=Math.min(p.res,i.width),c=document.createElement('canvas');c.width=w;c.height=i.height*w/i.width;c.getContext('2d').drawImage(i,0,0,c.width,c.height);IMGC[k]=c.toDataURL('image/jpeg',.88);r()};i.onerror=r;i.src=p.src})}}
function lgI(){const s=S.logo||IMGS.i,r=S.logo?S.logoAr:IMGS.iar;return s?`<img class="logo" src="${s}" style="aspect-ratio:${r||.77}">`:'<div class="logo lph" style="height:150px">indice.jpg</div>'}
function lgN(){const s=S.nlogo||IMGS.n,r=S.nlogo?S.nlogoAr:IMGS.nar;return s?`<img class="nimg" src="${s}" style="aspect-ratio:${r||.9}">`:'<div class="nimgph">noticias.jpg</div>'}
function ntoks(){const o=[];S.news.secs.forEach(s=>{const l=s.text.split('\n').map(x=>x.trim()).filter(Boolean);if(!l.length)return;o.push('\u0002'+s.name);l.forEach(x=>{o.push('\u0003');x.split(/\s+/).forEach(w=>o.push(w));o.push('\u0004')})});const c=S.news.cumple.trim();if(c){o.push('\u0002Cumpleaños','\u0003');('En esta edición, Cara al Sol quiere mandar saludos y celebrar a quienes cumplieron años durante estos últimos meses, ¡Felicidades '+c+'!').split(/\s+/).forEach(w=>o.push(w));o.push('\u0004')}return o}
function nhtml(k){let o='',c=null;const f=()=>{if(c&&c.w.length)o+=`<p class="${c.cls}">${rich(c.w)}</p>`;c=null};k.forEach(w=>{if(w[0]=='\u0002'){f();o+=`<div class="pill np">${esc(w.slice(1))}</div>`}else if(w=='\u0003'){f();c={cls:'bl',w:[]}}else if(w=='\u0004')f();else{if(!c)c={cls:'bl cn',w:[]};c.w.push(w)}});f();return o}
const ninner=(k,f)=>`<div class="tx c2">${f?lgN():''}${nhtml(k)}</div>`;
function fitsN(k,f){const M=$('#mm');M.innerHTML='';const p=pageEl(2,'',ninner(k,f));M.appendChild(p);const x=p.querySelector('.tx');return x.scrollWidth<=x.clientWidth+2}
function paginateN(){const all=ntoks(),out=[];let f=1;for(;;){if(fitsN(all,f)||all.length<2){out.push({k:all.slice(),f});break}let lo=1,hi=all.length-1,b=1;while(lo<=hi){const m=(lo+hi)>>1;if(fitsN(all.slice(0,m),f)){b=m;lo=m+1}else hi=m-1}while(b>1&&(all[b-1][0]=='\u0002'||all[b-1]=='\u0003'))b--;out.push({k:all.splice(0,b),f});f=0}return out}
function html(k,a){let o='',c=[];const f=()=>{if(c.length)o+='<p>'+rich(c)+'</p>';c=[]};k.forEach(w=>{if(w=='\n')f();else if(w[0]=='\u0001'){f();o+=imgH(a,w.slice(1))}else c.push(w)});f();return o}
function artInner(a,k,first,last){let h='';const T=first&&(a.fmt=='tts'||a.fmt=='tt'),G=last&&(a.fmt=='tts'||a.fmt=='ts');
 const tp=first?(a.photos||[]).filter(p=>p.pos=='top'):[];if(T||tp.length)h+=`<div class="tt">${T?`<h2 class="${a.sec>=3?'fun':''}">${esc(a.title||SECS[a.sec])}</h2>${a.sub?`<h3>${esc(a.sub)}</h3>`:''}`:''}${tp.map(p=>imgH(a,p.id,1)).join('')}</div>`;
 h+=`<div class="tx c${a.cols}">${html(k,a)}</div>`;if(G)h+=`<div class="sg">${esc(a.sign)}<br>${esc(a.name)}</div>`;return h}
function fits(a,k,f,l){const M=$('#mm');M.innerHTML='';const p=pageEl(2,'',artInner(a,k,f,l));M.appendChild(p);const x=p.querySelector('.tx');return a.cols==2?x.scrollWidth<=x.clientWidth+2:x.scrollHeight<=x.clientHeight+2}
function paginate(a){const all=toks(a.text,a),out=[];let first=true;
 for(;;){while(all[0]=='\n')all.shift();if(fits(a,all,first,true)||all.length<2){out.push({k:all.slice(),first,last:true});break}
  let lo=1,hi=all.length-1,b=1;while(lo<=hi){const m=(lo+hi)>>1;if(fits(a,all.slice(0,m),first,false)){b=m;lo=m+1}else hi=m-1}
  out.push({k:all.splice(0,b),first,last:false});first=false}return out}
function newsHas(){return S.news.on&&(S.news.secs.some(x=>x.text.trim())||S.news.cumple.trim())}
function newsInner(){const U=u=>{const l=(S.news.u[u]||'').split('\n').map(x=>x.trim()).filter(Boolean);return l.length?`<div class="pill">${u}</div><ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''};
 const c=S.news.cumple.trim();return `<div class="nw"><div class="L"><div><div class="nlogo">CARAALSOL<small>NOTICIAS</small></div></div><div>${U(UN[0])}${U(UN[1])}</div></div><div>${UN.slice(2).map(U).join('')}${c?`<div class="pill">Cumpleaños</div><p class="cum">• En esta edición, Cara al Sol quiere mandar saludos y celebrar a quienes cumplieron años durante estos últimos meses, ¡Felicidades ${esc(c)}!</p>`:''}</div></div>`}
function cover(SF,PG){const m=S.meta;const names=[...new Set([...S.colabs.split('\n'),...(S.auto?S.arts.map(a=>a.name):[])].map(x=>x.trim().toUpperCase()).filter(Boolean))];
 let rows=0,ix='';for(const s of [0,1,2,'n',3,4]){if(SF[s]==null)continue;rows++;const nm=s=='n'?'Noticias':SECS[s];let it='';if(typeof s=='number'&&s<3)S.arts.filter(a=>a.sec==s).forEach(a=>{rows++;it+=`<div class="ixi"><span>p.${PG[a.id]}</span> <b>${esc(a.title)}</b></div>`});ix+=`<div class="ig"><div class="ixs"><b>${nm}</b><span>p.${SF[s]}</span></div>${it}</div>`}
 const k=rows>22?.72:rows>16?.82:rows>12?.92:1;
 const d=document.createElement('div');d.className='pg od';
 d.innerHTML=`<div class="ct">CARA AL SOL N°${esc(m.numero)||'XX'}</div><div class="cb"><div class="cl">${lgI()}<div class="mo">MES: ${esc(m.mes)}<br>AÑO: ${esc(m.anio)}<br>NÚMERO: ${esc(m.numero)}</div><div class="mo" style="margin-top:34px">Correspondencia a:<br>Salta 2620 - Olivos<br><br>Prov. de Buenos Aires<br>CP 1636<br>REPÚBLICA ARGENTINA<br>Casilla de correo electrónico<br>Caraalsolrovers@gmail.com</div><div class="mo" style="clear:both;margin-top:40px">Revista editada en el Grupo Scout 137 “Jesús en el Huerto de los Olivos” de Scouts de Argentina</div><div class="mo">Equipo de redacción, compaginación y distribución: <b>Clan Comahue</b></div><div class="pill">Realización</div><div class="mo c">${esc(m.real).replace(/\n/g,'<br>')}</div><div class="pill">Colaboración</div><div class="mo cols2">${names.map(esc).join('<br>')}</div></div><div class="rope"></div><div class="cr" style="--k:${k}"><div class="pill k">Índice</div>${ix}</div></div>`;return d}
async function render(){const id=++run;await fonts();await prep();if(id!==run)return;st('Armando páginas…');
 const S0=$('#stage');S0.innerHTML='';let n=2;const SF={},PG={};
 for(const s of [0,1,2,'n',3,4]){
  if(s==='n'){if(newsHas())paginateN().forEach((p,i)=>{S0.appendChild(pageEl(n,'Noticias',ninner(p.k,p.f)));if(!i)SF.n=n;n++});continue}
  for(const a of S.arts.filter(a=>a.sec==s))paginate(a).forEach(p=>{S0.appendChild(pageEl(n,SECS[s],artInner(a,p.k,p.first,p.last)));if(p.first)PG[a.id]=n;if(SF[s]==null)SF[s]=n;n++})}
 S0.insertBefore(cover(SF,PG),S0.firstChild);
 const pv=$('#pv');pv.innerHTML='';const z=Math.min(1,(pv.clientWidth-8)/794);
 S0.querySelectorAll('.pg').forEach(p=>{const w=document.createElement('div');w.className='sh';w.style.zoom=z;w.appendChild(p.cloneNode(true));pv.appendChild(w)});
 st(S0.children.length+' páginas')}
/* ---------- exportar ---------- */
async function saveF(name,blob){if(dl)return dl.save({filename:name,data:blob});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function pdf(comp){const b=$(comp?'#pdfc':'#pdf');b.disabled=true;
 try{await render();await fonts();const W=595.28,H=720,P=new jspdf.jsPDF({unit:'pt',format:comp?[W*2,H]:[W,H],orientation:comp?'l':'p'});const pgs=[...$('#stage').children];if(comp)while(pgs.length%4)pgs.push(null);
  const cv=[];for(let i=0;i<pgs.length;i++){if(!pgs[i]){cv.push(null);continue}st('Generando páginas '+(i+1)+'/'+pgs.length);cv.push((await html2canvas(pgs[i],{scale:2,backgroundColor:'#fff',useCORS:true})).toDataURL('image/jpeg',.92))}const sp=[];if(comp){const N=cv.length;for(let s=0;s<N/2;s++)sp.push(s%2?[s+1,N-s]:[N-s,s+1])}else cv.forEach((_,i)=>sp.push([i+1]));sp.forEach((q,j)=>{if(j)P.addPage(comp?[W*2,H]:[W,H],comp?'l':'p');q.forEach((n,m)=>{if(cv[n-1])P.addImage(cv[n-1],'JPEG',m*W,0,W,H)})});
  await saveF('Cara-al-Sol-N'+(S.meta.numero||'XX')+(comp?'-compaginado':'')+'.pdf',P.output('blob'));st('Listo')}
 catch(e){st(e&&e.code=='declined'?'Descarga cancelada':'Error al generar el PDF')}b.disabled=false}
$('#pdf').onclick=()=>pdf(0);$('#pdfc').onclick=()=>pdf(1);
$('#sv').onclick=async()=>{try{await saveF('cara-al-sol-proyecto.json',new Blob([JSON.stringify(S)],{type:'application/json'}))}catch(e){}};
$('#op').onclick=()=>$('#opf').click();
$('#opf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));fill();list();sched()}catch(x){alert('Archivo inválido')}};r.readAsText(f)};
fill();list();render();
(async()=>{try{dl=await claude.use('downloads')}catch(e){}})();
